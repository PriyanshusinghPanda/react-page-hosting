apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-backend
  template:
    metadata:
      labels:
        app: cloudflared-backend
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - $(TUNNEL_TOKEN)
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-secrets
              key: tunnel-token
---
# This Deployment connects to the existing Backend Service
