apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deploydash-backend-ingress
  namespace: default
spec:
  ingressClassName: traefik
  rules:
  - host: api-deploydash.nstsdc.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: deploydash-backend
            port:
              number: 80
